<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chords</title>
  <meta name="description" content="ギターのコード譜ビューア">
  <meta name="theme-color" content="#1c1f26">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="back" id="back" hidden aria-label="曲一覧へ戻る">‹</a>
    <h1 id="page-title">Chords</h1>
  </header>
  <main id="main"></main>
  <nav class="toolbar" id="toolbar" hidden>
    <div class="group" aria-label="移調">
      <button data-act="tr-down" aria-label="半音下げる">♭</button>
      <span class="value" id="tr-value" title="移調">0</span>
      <button data-act="tr-up" aria-label="半音上げる">♯</button>
    </div>
    <div class="group" aria-label="文字サイズ">
      <button data-act="fs-down" aria-label="文字を小さく">A−</button>
      <button data-act="fs-up" aria-label="文字を大きく">A＋</button>
    </div>
    <div class="group" aria-label="自動スクロール">
      <button data-act="sc-slower" aria-label="遅く">−</button>
      <button data-act="sc-toggle" id="sc-toggle" aria-label="自動スクロール">▶</button>
      <button data-act="sc-faster" aria-label="速く">＋</button>
    </div>
    <div class="group">
      <button data-act="wake" id="wake" aria-pressed="false" title="画面を消さない">☀</button>
    </div>
  </nav>
  <dialog id="chord-dialog">
    <form method="dialog">
      <h2 id="dlg-name"></h2>
      <div id="dlg-body"></div>
      <div class="dlg-nav">
        <button type="button" id="dlg-prev" aria-label="前の押さえ方">‹</button>
        <span id="dlg-count"></span>
        <button type="button" id="dlg-next" aria-label="次の押さえ方">›</button>
      </div>
      <button type="button" id="dlg-known" aria-pressed="false"></button>
      <button class="dlg-close" value="close">閉じる</button>
    </form>
  </dialog>
</body>
</html>
